# Usage Widget v2 — seeded to %APPDATA%\UsageWidget\config.yaml on first run
# Defaults stay quiet: only Claude personal is enabled in this file.
# First-run discovery may enable Cursor/GPT/Gemini if those logins are found
# (never enables claude-work unless that exact account id is discovered).
# Flip enabled: true (or use the Accounts tray menu) for more accounts.

poll_seconds: 60
app_name: Usage Widget v2

accounts:
  - id: claude-personal
    provider: claude
    label: Claude Personal
    enabled: true
    auth:
      mode: auto

  # Second Claude login — enable when you have a separate config root
  - id: claude-work
    provider: claude
    label: Claude Work
    enabled: false
    auth:
      mode: token_file
      token_file: ~/.claude-work/.credentials.json
      claude_home: ~/.claude-work

  - id: cursor-main
    provider: cursor
    enabled: false
    auth:
      mode: auto

  - id: gpt-main
    provider: gpt
    enabled: false
    auth:
      mode: auto

  - id: gemini-main
    provider: gemini
    enabled: false
    auth:
      mode: auto

active_profile: default

profiles:
  default:
    icon:
      mode: single
      layout: primary_only
      max_slots: 1
      rotate_seconds: 8
      color_by: percent
      thresholds:
        warn: 60
        critical: 85
      show_labels: false
      # Prefer one large % — tray icons are ~16–24px on screen.
      slots:
        - ref: claude-personal.session
          show: percent
          label: S
    tooltip:
      format: compact
      max_chars: 127
      slots:
        - ref: claude-personal.session
          show: percent_and_reset
          label: Session
        - ref: claude-personal.week
          show: percent
          label: Week
    details:
      show: all_enabled_accounts
      group_by: account
      metric_order: as_returned
      always_include_resets: true
      show_errors: true
      show_plan: true
      show_fetched_at: true

  # Example multi-account glance — enable claude-work first, then switch profile
  two-claude:
    icon:
      mode: composite
      layout: split
      max_slots: 2
      slots:
        - ref: claude-personal.session
          show: percent_and_reset
          label: P
        - ref: claude-work.session
          show: percent_and_reset
          label: W
    tooltip:
      format: compact
      max_chars: 127
      slots:
        - ref: claude-personal.session
          show: percent_and_reset
        - ref: claude-work.session
          show: percent_and_reset
    details:
      show: all_enabled_accounts
      group_by: account
      always_include_resets: true
      show_errors: true
      show_plan: true
      show_fetched_at: true
